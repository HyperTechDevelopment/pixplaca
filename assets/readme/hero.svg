<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">PixPlaca — placas de QR Code Pix</title>
  <desc id="hero-desc">Faixa de abertura: nome do projeto, promessa e miniatura estilizada de placa Pix em verde-petróleo e laranja.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.4" fill="#12A594" opacity="0.22"/>
    </pattern>
    <linearGradient id="plateBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17B79E"/>
      <stop offset="1" stop-color="#0E9A84"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="28" fill="#0E2420"/>
  <rect width="1200" height="340" rx="28" fill="url(#dots)" opacity="0.5"/>
  <g id="title-block" transform="translate(64 48)">
    <g id="eyebrow">
      <rect x="0" y="0" width="330" height="40" rx="20" fill="#12A594" opacity="0.18"/>
      <rect x="0" y="0" width="330" height="40" rx="20" fill="none" stroke="#12A594" stroke-width="2" opacity="0.7"/>
      <circle cx="26" cy="20" r="7" fill="#12A594"/>
      <text x="42" y="27" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#7FE3D2">GERADOR DE PLACAS PIX</text>
    </g>
    <text x="0" y="118" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="#FFFFFF">Pix<tspan fill="#2BD9B8">Placa</tspan></text>
    <text x="2" y="168" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="600" fill="#E8F5F1">Sua placa de QR Code Pix, pronta para imprimir.</text>
    <text x="2" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#9CC5BB">30 designs &#8226; PNG 1500x2000 + PDF A4 &#8226; tudo no navegador</text>
    <g id="meta-row" transform="translate(0 232)">
      <rect x="0" y="0" width="172" height="40" rx="20" fill="#F26B1D"/>
      <text x="20" y="27" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Ver demo &#8599;</text>
      <rect x="186" y="0" width="228" height="40" rx="20" fill="none" stroke="#3A5A54" stroke-width="2"/>
      <text x="208" y="27" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" fill="#CDE7E0">pnpm install + dev</text>
    </g>
  </g>
  <g id="project-proof" transform="translate(830 40)">
    <rect x="12" y="16" width="250" height="268" rx="26" fill="#061A17" opacity="0.6"/>
    <g id="mini-plate">
      <rect x="0" y="0" width="250" height="268" rx="26" fill="url(#plateBody)"/>
      <rect x="0" y="0" width="250" height="86" rx="26" fill="#F26B1D"/>
      <rect x="0" y="60" width="250" height="26" fill="#F26B1D"/>
      <text x="125" y="38" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">pix</text>
      <text x="125" y="66" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Cantina Central</text>
      <rect x="55" y="102" width="140" height="118" rx="16" fill="#FFFFFF"/>
      <g id="mini-qr" fill="#14201D">
        <rect x="69" y="114" width="30" height="30" rx="4"/>
        <rect x="155" y="114" width="30" height="30" rx="4"/>
        <rect x="69" y="178" width="30" height="30" rx="4"/>
        <rect x="111" y="114" width="18" height="12" rx="2"/>
        <rect x="135" y="114" width="12" height="12" rx="2"/>
        <rect x="111" y="132" width="12" height="12" rx="2"/>
        <rect x="129" y="132" width="24" height="12" rx="2"/>
        <rect x="159" y="152" width="26" height="12" rx="2"/>
        <rect x="111" y="152" width="40" height="12" rx="2"/>
        <rect x="111" y="170" width="18" height="12" rx="2"/>
        <rect x="135" y="170" width="20" height="12" rx="2"/>
        <rect x="161" y="170" width="24" height="12" rx="2"/>
        <rect x="111" y="188" width="32" height="12" rx="2"/>
        <rect x="149" y="188" width="36" height="12" rx="2"/>
      </g>
      <rect x="80" y="232" width="90" height="22" rx="11" fill="#F26B1D"/>
    </g>
  </g>
</svg>
